name: Deploy Static Firebase App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Replace Firebase config placeholders
      run: |
        sed -i 's|__API_KEY__|${{ secrets.FIREBASE_API_KEY }}|' firebase-config.js
        sed -i 's|__AUTH_DOMAIN__|${{ secrets.FIREBASE_AUTH_DOMAIN }}|' firebase-config.js
        sed -i 's|__PROJECT_ID__|${{ secrets.FIREBASE_PROJECT_ID }}|' firebase-config.js
        sed -i 's|__STORAGE_BUCKET__|${{ secrets.FIREBASE_STORAGE_BUCKET }}|' firebase-config.js
        sed -i 's|__MESSAGING_SENDER_ID__|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|' firebase-config.js
        sed -i 's|__APP_ID__|${{ secrets.FIREBASE_APP_ID }}|' firebase-config.js
        sed -i 's|__MEASUREMENT_ID__|${{ secrets.FIREBASE_MEASUREMENT_ID }}|' firebase-config.js

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
